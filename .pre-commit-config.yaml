repos:
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv tool run ty check
        language: system
        types: [python]
        pass_filenames: false
        args: [petrovisor/]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      # Run the linter/checker with auto-fix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format