# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Install importlib-metadata for Python 3.7
      if: matrix.python-version == '3.7'  # Only execute for Python 3.7
      run: |
        python -m pip install importlib-metadata==4.13.0
    - name: Lint with ruff
      run: |
        python -m pip install ruff
        ruff check petrovisor/
    - name: Test with pytest
      run: |
        TEST_WORKSPACE="${{ secrets.TEST_WORKSPACE }}" TEST_URL="${{ secrets.TEST_URL }}" TEST_KEY="${{ secrets.TEST_KEY }}" PYTHONPATH='.' pytest
